
<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Інформація про подію</title>
    <link rel="icon" type="image/png" th:href="@{images/favicon.png}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>

    <h1 th:text="${event.title}">Назва події</h1>

    <section>
        <h2>Інформація про подію</h2>

        <p>
            Дата:
            <span th:text="${event.eventDate}"></span>
        </p>

        <p>
            Місце проведення:
            <span th:text="${event.place.name}"></span>
        </p>

        <p>
            Адреса:
            <span th:text="${event.place.address}"></span>
        </p>
    </section>

    <section>
        <h2>Доступні квитки</h2>

        <div th:if="${#lists.isEmpty(tickets)}">
            <p>На цю подію наразі немає вільних квитків.</p>
        </div>

        <div class="ticket-list">
            <div class="ticket-card" th:each="ticket : ${tickets}">
                <h3>
                    Місце № <span th:text="${ticket.seatnumber}"></span>
                </h3>

                <p>
                    Ціна:
                    <strong th:text="${ticket.cost + ' грн'}"></strong>
                </p>

                <a th:href="@{/tickets/{id}/purchase(id=${ticket.id})}">
                    Придбати квиток
                </a>
            </div>
        </div>
    </section>

    <br>

</main>

</body>
</html>
