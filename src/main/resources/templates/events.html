
<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Головна | EventApp</title>
    <link rel="icon" type="image/png" th:href="@{images/favicon.png}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>

    <section>
        <h2>Пошук вільних квитків</h2>

        <form th:action="@{/events/search}" method="get">
            <input
                    type="text"
                    name="title"
                    placeholder="Введіть назву події"
                    required
            >
            <button type="submit">Знайти квитки</button>
        </form>
    </section>

    <hr>

    <section>
        <h2>Список популярних подій</h2>

        <div th:if="${#lists.isEmpty(events)}">
            <p>Наразі немає майбутніх подій із вільними квитками.</p>
        </div>

        <div class="event-card" th:each="event : ${events}">

            <h3 class="event-card-title">
                <a th:href="@{/events/{id}(id=${event.id})}"
                   th:text="${event.title}">
                    Назва події
                </a>
            </h3>

            <p>
                Дата:
                <span th:text="${event.eventDate}"></span>
            </p>

            <p>
                Місце:
                <span th:text="${event.placeName}"></span>
            </p>

            <p>
                Адреса:
                <span th:text="${event.placeAddress}"></span>
            </p>

            <p>
                Вільних квитків:
                <strong th:text="${event.availableTickets}"></strong>
            </p>

            <hr>

        </div>
    </section>

</main>

</body>
</html>
