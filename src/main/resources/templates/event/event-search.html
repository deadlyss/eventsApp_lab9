<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Результати пошуку | EventApp</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>

    <section>
        <h2>Результати пошуку подій</h2>

        <p>
            Пошуковий запит:
            <strong th:text="${searchedTitle}"></strong>
        </p>

        <div th:if="${#lists.isEmpty(events)}">
            <p>Подій із вільними квитками не знайдено.</p>
        </div>

        <div class="event-card" th:each="event : ${events}">

            <h3 class="event-card-title">
                <a th:href="@{/events/{id}(id=${event.id})}"
                   th:text="${event.title}">
                    Назва події
                </a>
            </h3>

            <p>
                Дата:
                <span th:text="${#temporals.format(event.eventDate, 'dd.MM.yyyy HH:mm')}"></span>
            </p>

            <p>
                Місце:
                <span th:text="${event.placeName}"></span>
            </p>

            <p>
                Адреса:
                <span th:text="${event.placeAddress}"></span>
            </p>

            <p>
                Вільних квитків:
                <strong th:text="${event.availableTickets}"></strong>
            </p>

            <hr>

        </div>
    </section>

    <p>
        <a class="auth-back" th:href="@{/events}">← Повернутися на головну</a>
    </p>

</main>

</body>
</html>
