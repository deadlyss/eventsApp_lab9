
<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | EventApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{images/favicon.png}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">👤</div>

        <h1>Вхід до системи</h1>

        <p class="auth-description">
            Увійдіть до свого облікового запису,
            щоб користуватися всіма можливостями EventApp.
        </p>

        <div th:if="${param.error}" class="auth-error">
            Неправильний email або пароль.
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">

            <input type="hidden" name="redirect" th:value="${redirect}">

            <div class="auth-field">
                <label for="username">Email</label>
                <input
                        type="email"
                        id="username"
                        name="username"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required>
            </div>

            <div class="auth-field">
                <label for="password">Пароль</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Введіть пароль"
                        autocomplete="current-password"
                        required>
            </div>

            <button type="submit" class="auth-button">
                Увійти
            </button>

        </form>

        <div class="auth-divider"></div>

        <p class="auth-register-text">
            Ще не маєте облікового запису?
        </p>

        <a class="auth-register-button"
           th:href="@{/customers/new(redirect=${redirect})}">
            Зареєструватися
        </a>

        <a class="auth-back" th:href="@{/events}">
            ← Повернутися на головну
        </a>

    </div>

</main>

</body>
</html>
